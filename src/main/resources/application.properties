spring.application.name=owlexa-backend

server.port=${SERVER_PORT:8081}

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/owlexa_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:owlexa-super-secret-key-minimum-256-bits-long-change-in-production-env}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000