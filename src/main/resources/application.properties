spring.application.name=owlexa-backend

server.port=${SERVER_PORT:8081}

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/owlexa_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Multipart requests are rejected before reaching application code when they
# exceed the configured hard limit. The file service applies the same limit.
spring.servlet.multipart.max-file-size=${FILE_MAX_SIZE:50MB}
spring.servlet.multipart.max-request-size=${FILE_MAX_SIZE:50MB}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
jwt.secret=${JWT_SECRET:owlexa-super-secret-key-minimum-256-bits-long-change-in-production-env}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=2592000000

# ── Session Management ────────────────────────────────────────────
# Sliding expiration: session expires after this much inactivity (30 days)
app.session.inactive-timeout-days=30

# Absolute expiration: session forced re-login after this duration (90 days)
app.session.absolute-timeout-days=90

# Maximum concurrent active devices per user
app.session.max-devices=5

# Cleanup job: runs daily at 3:00 AM
app.session.cleanup-cron=0 0 3 * * *

# How long to keep inactive/revoked sessions before hard-delete (days)
app.session.cleanup-retention-days=30

# Cookie security (set to true in production with HTTPS)
cookie.secure=false

# ── Enrollment & Fee Management ──────────────────────────────────
# Cron for overdue enrollment auto-drop (default: 2:00 AM daily)
app.enrollment.overdue-cron=0 0 2 * * *
# Grace period in days after dueDate before auto-drop
app.enrollment.fee-grace-days=7

# ── SePay Payment Integration (Sandbox) ──────────────────────────
# Dot-notation keys match @Value annotations in Java code.
# Environment variables (SEPAY_WEBHOOK_SECRET, etc.) override defaults.

sepay.webhook.secret=${SEPAY_WEBHOOK_SECRET:whsec_vAnK2q7Fb6a1kvNzlRCnGRTTd5fwxDxz}
sepay.webhook.timestamp-tolerance-seconds=${SEPAY_WEBHOOK_TS_TOLERANCE:300}

sepay.payment-code.prefix=${SEPAY_PAYMENT_CODE_PREFIX:OWX}

# ── Bank Transfer & Payment Configuration ────────────────────────

app.payment.bank-transfer-expiry-minutes=${BANK_TRANSFER_EXPIRY_MINUTES:30}
app.payment.expiration-check-interval-ms=${EXPIRATION_CHECK_INTERVAL_MS:300000}

app.payment.bank-transfer.bank-name=${BANK_TRANSFER_BANK_NAME:MB Bank}
app.payment.bank-transfer.bank-code=${BANK_TRANSFER_BANK_CODE:MB}
app.payment.bank-transfer.account-number=${BANK_TRANSFER_ACCOUNT_NUMBER:70740011223344}
app.payment.bank-transfer.account-holder=${BANK_TRANSFER_ACCOUNT_HOLDER:NGUYEN TUAN KIET}
app.payment.bank-transfer.qr-template=compact2

# ── AI Scoring Configuration ─────────────────────────────────────
owlexa.ai.enabled=true
owlexa.ai.provider=deepseek

# DeepSeek API
owlexa.ai.base-url=https://api.deepseek.com
owlexa.ai.api-key=${AI_API_KEY:}
owlexa.ai.model=deepseek-chat

# Network
owlexa.ai.timeout-ms=30000
owlexa.ai.max-retries=3

# Module 6 - AI Grading
owlexa.ai-grading.enabled=${AI_GRADING_ENABLED:true}
owlexa.ai-grading.provider=OPENAI
owlexa.ai-grading.base-url=https://api.openai.com
owlexa.ai-grading.api-key=${OPENAI_API_KEY:}
owlexa.ai-grading.model=${OPENAI_GRADING_MODEL:gpt-5.6-sol}
owlexa.ai-grading.max-tokens=${OPENAI_GRADING_MAX_TOKENS:4000}
owlexa.ai-grading.timeout-ms=${OPENAI_GRADING_TIMEOUT_MS:60000}

# Centralized file storage
owlexa.files.max-size=${FILE_MAX_BYTES:52428800}
owlexa.files.storage=${FILE_STORAGE:LOCAL}
owlexa.files.local-root=${FILE_LOCAL_ROOT:uploads}
owlexa.files.public-base-url=${FILE_PUBLIC_BASE_URL:http://localhost:8081/uploads}
owlexa.files.orphan-retention-days=${FILE_ORPHAN_RETENTION_DAYS:7}
owlexa.files.orphan-scan-cron=${FILE_ORPHAN_SCAN_CRON:0 30 3 * * *}

# S3-compatible storage (used when FILE_STORAGE=S3)
owlexa.files.s3.bucket=${FILE_S3_BUCKET:}
owlexa.files.s3.region=${FILE_S3_REGION:ap-southeast-1}
owlexa.files.s3.endpoint=${FILE_S3_ENDPOINT:}
owlexa.files.s3.access-key=${FILE_S3_ACCESS_KEY:}
owlexa.files.s3.secret-key=${FILE_S3_SECRET_KEY:}
owlexa.files.s3.public-base-url=${FILE_S3_PUBLIC_BASE_URL:}
