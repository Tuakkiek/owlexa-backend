spring.application.name=owlexa-backend
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/owlexa_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Local development defaults. Always override secrets in deployed environments.
app.jwt.secret=${JWT_SECRET:owlexa-local-development-jwt-secret-change-me}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.seed.admin.enabled=${SEED_ADMIN_ENABLED:true}
app.seed.admin.phone-number=${ADMIN_PHONE_NUMBER:0900000000}
app.seed.admin.full-name=${ADMIN_FULL_NAME:System Administrator}
app.seed.admin.email=${ADMIN_EMAIL:admin@owlexa.local}
app.seed.admin.password=${ADMIN_PASSWORD:password123}
