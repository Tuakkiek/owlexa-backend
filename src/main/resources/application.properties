spring.application.name=owlexa-backend

server.port=${SERVER_PORT:8081}

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/owlexa_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT Configuration
jwt.secret=${JWT_SECRET:owlexa-super-secret-key-minimum-256-bits-long-change-in-production-env}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=2592000000

# ── Session Management ────────────────────────────────────────────
# Sliding expiration: session expires after this much inactivity (30 days)
app.session.inactive-timeout-days=30

# Absolute expiration: session forced re-login after this duration (90 days)
app.session.absolute-timeout-days=90

# Maximum concurrent active devices per user
app.session.max-devices=5

# Cleanup job: runs daily at 3:00 AM
app.session.cleanup-cron=0 0 3 * * *

# How long to keep inactive/revoked sessions before hard-delete (days)
app.session.cleanup-retention-days=30

# Cookie security (set to true in production with HTTPS)
cookie.secure=false

# ── Enrollment & Fee Management ──────────────────────────────────
# Cron for overdue enrollment auto-drop (default: 2:00 AM daily)
app.enrollment.overdue-cron=0 0 2 * * *
# Grace period in days after dueDate before auto-drop
app.enrollment.fee-grace-days=7

# ── SePay Payment Integration (Sandbox) ──────────────────────────
sepay.api.base-url=${SEPAY_API_BASE_URL:https://userapi-sandbox.sepay.vn}
sepay.api.token=${SEPAY_API_TOKEN:}
sepay.webhook.secret=${SEPAY_WEBHOOK_SECRET:}
sepay.webhook.auth-mode=${SEPAY_WEBHOOK_AUTH_MODE:HMAC_SHA256}
sepay.webhook.timestamp-tolerance-seconds=${SEPAY_WEBHOOK_TS_TOLERANCE:300}
sepay.payment-code.prefix=${SEPAY_PAYMENT_CODE_PREFIX:OWX}

# ── Bank Transfer (QR) Payment Configuration ─────────────────────
# Payment code prefix for bank transfer QR payments (e.g., OWX)
app.payment.bank-transfer-expiry-minutes=${BANK_TRANSFER_EXPIRY_MINUTES:30}
app.payment.expiration-check-interval-ms=${EXPIRATION_CHECK_INTERVAL_MS:300000}
app.payment.bank-transfer.bank-name=${BANK_TRANSFER_BANK_NAME:MB Bank}
app.payment.bank-transfer.account-number=${BANK_TRANSFER_ACCOUNT_NUMBER:}
app.payment.bank-transfer.account-holder=${BANK_TRANSFER_ACCOUNT_HOLDER:Owlexa English Center}